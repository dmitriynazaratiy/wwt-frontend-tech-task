name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version (default reads .nvmrc)
        required: true
        default: default
        type: choice
        options:
          - default
          - 20.x
          - 22.x
          - 24.x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version != 'default' && inputs.node-version || '' }}
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm@12.15.0

      - name: Install dependencies
        run: pnpm install

      - name: Run build
        run: pnpm build

      - name: Run format
        run: pnpm format:check:all

      - name: Run lint
        run: pnpm lint:all

      - name: Run tests
        run: pnpm test --run --passWithNoTests
